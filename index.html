<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Stealth Mode Three — a proctored design assessment studio. Send vectorization briefs, monitor candidates live by camera, mic and screen, and review submissions in one place." />
<meta name="color-scheme" content="light" />
<title>Stealth Mode Three — Design Assessment Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6F71F8;
  --brand-deep:#4B4DDB;
  --brand-ink:#3B3DC4;
  --grape:#9B6CF6;
  --coral:#FF7A66;
  --brand-soft:#ECECFE;
  --brand-soft2:#F7F7FF;
  --bg:#F4F4FC;
  --bg-grad:
    radial-gradient(1200px 640px at 8% -10%, #EAEBFF 0%, rgba(234,235,255,0) 55%),
    radial-gradient(980px 560px at 102% -4%, #F4ECFF 0%, rgba(244,236,255,0) 52%),
    radial-gradient(900px 600px at 60% 108%, #FFF0EC 0%, rgba(255,240,236,0) 50%),
    #F5F5FD;
  --surface:#FFFFFF;
  --surface-2:#FAFAFF;
  --ink:#22223A;
  --muted:#6C6C88;
  --faint:#9A9AB6;
  --line:#E7E7F5;
  --line-strong:#D8D8EE;
  --ok:#1F9D6B; --ok-soft:#E6F6EF;
  --warn:#C77D1A; --warn-soft:#FBF1E0;
  --err:#D64550; --err-soft:#FBE9EB;
  --shadow-s:0 1px 2px rgba(40,40,90,.06),0 2px 6px rgba(40,40,90,.05);
  --shadow-m:0 14px 34px rgba(79,79,180,.12);
  --shadow-l:0 30px 70px rgba(70,70,160,.18);
  --radius:18px; --radius-s:12px; --r-pill:999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-grad);background-attachment:fixed;color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;
}
h1,h2,h3,.display{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.01em}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600}
button{font-family:inherit}
a{color:var(--brand-ink);text-decoration:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--brand-deep)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .hidden{display:none !important}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app>*{animation:fade .4s ease both}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.78);backdrop-filter:saturate(170%) blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand img{height:34px;width:auto;display:block;filter:drop-shadow(0 3px 8px rgba(111,113,248,.3))}
.brand-sep{width:1px;height:26px;background:var(--line-strong)}
.brand-tag{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:10px}

.wrap{max-width:1200px;margin:0 auto;padding:34px 24px 90px}
.center-wrap{max-width:980px;margin:0 auto;padding:42px 24px 90px}

/* ---------- Buttons ---------- */
.btn{appearance:none;border:1px solid transparent;border-radius:var(--r-pill);padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .08s,box-shadow .16s,background .16s,border-color .16s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(110deg,var(--brand) 0%,var(--grape) 100%);color:#fff;box-shadow:0 8px 20px rgba(105,90,240,.34)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(105,90,240,.46)}
.btn-ghost{background:#fff;color:var(--brand-ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--brand);background:var(--brand-soft2)}
.btn-soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn-soft:hover{background:#E3E3FE}
.btn-link{background:none;border:none;color:var(--brand-deep);padding:6px 4px;font-weight:600;cursor:pointer}
.btn-link:hover{text-decoration:underline}
.btn-danger{background:#fff;color:var(--err);border-color:#F0C9CD}
.btn-danger:hover{background:var(--err-soft)}
.btn-lg{padding:14px 28px;font-size:15px} .btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* ---------- Cards / fields ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-m)}
.card-pad{padding:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.input,.textarea,select{width:100%;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:inherit;color:var(--ink);background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(111,113,248,.16);background:#fff}
.textarea{resize:vertical;min-height:120px;line-height:1.55}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.pw-wrap{position:relative}
.pw-wrap .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--brand-deep);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px}

/* chevron signature */
.chev{display:inline-flex;gap:3px;align-items:center}
.chev i{display:block;width:9px;height:15px;background:var(--brand);clip-path:polygon(0 0,55% 0,100% 50%,55% 100%,0 100%,45% 50%)}
.chev i:nth-child(2){opacity:.6;background:var(--grape)} .chev i:nth-child(3){opacity:.32;background:var(--coral)}
.chev.lg i{width:15px;height:25px}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-l);opacity:0;pointer-events:none;transition:.25s;z-index:130;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:var(--r-pill)}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-err{background:var(--err-soft);color:var(--err)} .pill-idle{background:var(--brand-soft);color:var(--brand-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.dot.live{animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- Hero (auth screens) ---------- */
.auth-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center}
.hero{position:relative;border-radius:26px;padding:38px;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#6F71F8 0%,#8B5CF6 52%,#B069E8 100%);box-shadow:var(--shadow-l);min-height:430px}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 280px at 85% 12%,rgba(255,255,255,.22),transparent 60%),radial-gradient(360px 300px at 8% 95%,rgba(255,122,102,.4),transparent 60%);pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h1{font-size:34px;line-height:1.08;margin:12px 0 12px;color:#fff}
.hero p{color:rgba(255,255,255,.9);font-size:15px;max-width:34ch;margin:0}
.hero .logo-w{height:30px;filter:brightness(0) invert(1);margin-bottom:6px}
.fan{position:absolute;right:-30px;bottom:-26px;display:flex;z-index:1}
.fan img{width:104px;height:140px;object-fit:cover;object-position:top;border-radius:12px;border:3px solid rgba(255,255,255,.9);box-shadow:0 16px 30px rgba(40,20,90,.35);background:#fff}
.fan img:nth-child(1){transform:rotate(-11deg) translateX(34px) translateY(8px)}
.fan img:nth-child(2){transform:rotate(-2deg);z-index:2}
.fan img:nth-child(3){transform:rotate(9deg) translateX(-26px) translateY(6px)}

/* ---------- Sections ---------- */
.grid-2{display:grid;grid-template-columns:1.12fr .88fr;gap:26px}
.section-title{display:flex;align-items:center;gap:11px;margin:0 0 4px}
.section-title h2{font-size:21px;margin:0}

/* proof picker cards */
.proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px;margin-top:8px}
.proof-card{position:relative;border:2px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;background:#fff;transition:transform .14s,box-shadow .16s,border-color .14s}
.proof-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-m)}
.proof-card img{width:100%;display:block;aspect-ratio:3/3.4;object-fit:cover;object-position:top;background:#f3f3fc}
.proof-card .cap{padding:9px 11px 11px}
.proof-card .cap b{display:block;font-size:13px;line-height:1.25}
.proof-card .cap span{font-size:11px;color:var(--muted)}
.proof-card.on{border-color:var(--brand);box-shadow:0 0 0 4px rgba(111,113,248,.16)}
.proof-card .tick{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;backdrop-filter:blur(2px)}
.proof-card.on .tick{background:var(--brand);border-color:var(--brand);color:#fff}

.session-item{border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px;background:var(--surface-2)}
.session-item .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.session-item h4{margin:0 0 2px;font-size:15px;font-family:'Inter'}
.linkbox{display:flex;gap:8px;margin-top:11px}
.linkbox input{flex:1;font-size:12.5px;background:#fff;border:1px dashed var(--line-strong);border-radius:10px;padding:9px 11px;color:var(--brand-ink);font-family:ui-monospace,monospace}
.empty{text-align:center;color:var(--muted);padding:38px 14px;border:1px dashed var(--line-strong);border-radius:15px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--brand-deep);border-bottom-color:var(--brand)}

/* preview ribbon */
.preview-ribbon{background:linear-gradient(110deg,var(--ink),#3a3a5c);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:12px;justify-content:center;font-size:13px;font-weight:500;flex-wrap:wrap}
.preview-ribbon .btn{padding:6px 13px;font-size:12.5px}

/* candidate proctor bar */
.proctorbar{position:sticky;top:64px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-s);margin-bottom:22px;flex-wrap:wrap}
.proctorbar .recwrap{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--err);font-family:'Space Grotesk'}
.proctorbar .stat{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.proctorbar .stat .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.proctorbar .stat.off .ic{background:var(--err-soft);color:var(--err)}
.proctorbar .timer{margin-left:auto;font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em}
.pip{position:fixed;right:18px;bottom:18px;width:190px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-l);z-index:35;border:2px solid #fff;background:#000}
.pip video{width:100%;display:block} .pip .lbl{position:absolute;left:8px;bottom:7px;font-size:10px;color:#fff;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px;font-weight:600}

.ws{display:grid;grid-template-columns:1.4fr .86fr;gap:24px;align-items:start}
.pdf-frame{width:100%;height:76vh;min-height:540px;border:1px solid var(--line-strong);border-radius:14px;background:#fff}
.pdf-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.work-card{position:sticky;top:142px}
.complete-box{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:14px;background:var(--surface-2);cursor:pointer}
.complete-box.on{border-color:var(--ok);background:var(--ok-soft)} .complete-box input{width:20px;height:20px;accent-color:var(--ok)}

/* checklist */
.checklist{display:flex;flex-direction:column;gap:14px;margin:22px 0}
.check-item{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--surface-2)}
.check-item.done{border-color:var(--ok);background:var(--ok-soft)}
.check-icn{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-soft),#EFE6FF);color:var(--brand-deep);flex:none}
.check-item.done .check-icn{background:#fff;color:var(--ok)}
.check-body{flex:1;min-width:0} .check-body b{font-size:15px} .check-body p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.meter{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;max-width:200px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .08s}
.preview-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.stage-box{background:#0c0c14;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:16/10}
.stage-box video{width:100%;height:100%;object-fit:cover;display:block}
.stage-box .ph{position:absolute;inset:0;display:grid;place-items:center;color:#7d7d96;font-size:13px;text-align:center;padding:14px}
.stage-box .tag{position:absolute;top:8px;left:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:6px;font-weight:600;letter-spacing:.05em}

.banner{border-radius:13px;padding:13px 16px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.banner-warn{background:var(--warn-soft);color:#8a5a12;border:1px solid #F1DCB4}
.banner-err{background:var(--err-soft);color:#9a2b34;border:1px solid #F2C9CD}
.banner-info{background:var(--brand-soft2);color:var(--brand-ink);border:1px solid var(--line-strong)}

.code-area{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.steps{display:flex;gap:8px;margin:6px 0 22px;flex-wrap:wrap;align-items:center}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-size:12px;font-weight:700}
.step.on .n{background:var(--brand);color:#fff} .step.done .n{background:var(--ok);color:#fff}
.thumb-strip{display:flex;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.thumb-strip img{width:74px;height:96px;object-fit:cover;object-position:top;border-radius:9px;border:1px solid var(--line-strong);background:#fff}

@media (max-width:920px){.auth-grid{grid-template-columns:1fr}.hero{min-height:300px}.grid-2{grid-template-columns:1fr}.ws{grid-template-columns:1fr}.work-card{position:static}.preview-stage{grid-template-columns:1fr}}
@media (max-width:560px){.brand-tag,.brand-sep{display:none}.pip{width:128px}.pdf-frame{height:62vh;min-height:400px}.fan{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="ribbon"></div>
<div id="app"></div>
<div id="toast"></div>
<div class="pip hidden" id="pip"><video id="pipVideo" autoplay muted playsinline></video><span class="lbl">● Camera</span></div>
<canvas id="composer" width="1280" height="720" style="display:none"></canvas>
<video id="srcCam" autoplay muted playsinline style="display:none"></video>
<video id="srcScreen" autoplay muted playsinline style="display:none"></video>

const $ = (s,r=document)=>r.querySelector(s);
const app = $('#app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
function b64urlEncode(o){const s=encodeURIComponent(JSON.stringify(o));return btoa(unescape(s)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64urlDecode(str){try{str=str.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(str))));}catch(e){return null;}}
function uid(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<7;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
function fmtDate(ts){return new Date(ts).toLocaleString();}
function baseUrl(){return location.origin+location.pathname;}
const Store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function setAdminPassword(pw){const salt=crypto.getRandomValues(new Uint8Array(8)).reduce((a,b)=>a+b.toString(16).padStart(2,'0'),'');Store.set('sm3_admin',{salt,hash:await sha256(salt+pw),created:Date.now()});}
async function checkAdminPassword(pw){const a=Store.get('sm3_admin');if(!a)return false;return (await sha256(a.salt+pw))===a.hash;}
function adminExists(){return !!Store.get('sm3_admin');}
function resetAdminPassword(){Store.del('sm3_admin');}
let SESSION_AUTHED=false;

/* preview mode (admin trying the candidate flow in-app) */
let PREVIEW_MODE=false;

function parseHash(){return new URLSearchParams(location.hash.replace(/^#/,''));}
function go(h){location.hash=h;}
window.addEventListener('hashchange',()=>{if(!PREVIEW_MODE)render();});

function render(){
  const p=parseHash();const c=p.get('c');
  if(c){const cfg=b64urlDecode(c);return cfg?enterCandidate(cfg,false):renderBadLink();}
  return renderAdmin();
}

function ribbon(html){$('#ribbon').innerHTML=html||'';}

function topbar(tag){
  return `<div class="topbar"><div class="topbar-inner">
    <div class="brand"><img src="${ASSETS.logo}" alt="Stealth Mode Three" /><span class="brand-sep"></span><span class="brand-tag">${tag||'Design Assessment Studio'}</span></div>
    <div class="top-actions" id="topActions"></div></div></div>`;
}

/* ===================== ADMIN ===================== */
function renderAdmin(){
  ribbon('');PREVIEW_MODE=false;
  if(!adminExists())return renderAdminSetup();
  if(!SESSION_AUTHED)return renderAdminLogin();
  return renderAdminDashboard();
}

function pwField(id,ph){
  return `<div class="pw-wrap"><input class="input" type="password" id="${id}" placeholder="${ph}" autocomplete="off">
    <button class="toggle" type="button" data-for="${id}">Show</button></div>`;
}
function wirePwToggles(){document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const f=$('#'+b.dataset.for);if(f){f.type=f.type==='password'?'text':'password';b.textContent=f.type==='password'?'Show':'Hide';}});}

function authHero(){
  const t=ASSETS.assessments;
  return `<div class="hero">
    <img class="logo-w" src="${ASSETS.logo}" alt="">
    <span class="eyebrow">Stealth Mode Three</span>
    <h1>Proof briefs in.<br>Proctored talent out.</h1>
    <p>Send designers real vectorization briefs, watch them work live, and review every submission in one place.</p>
    <div class="fan"><img src="${t[2].thumb}"><img src="${t[4].thumb}"><img src="${t[0].thumb}"></div>
  </div>`;
}

function renderAdminSetup(){
  app.innerHTML=topbar('Admin setup')+`<div class="center-wrap"><div class="auth-grid">
    ${authHero()}
    <div>
      <span class="eyebrow">First-time setup</span>
      <h1 style="font-size:27px;margin:8px 0 8px">Create your admin password</h1>
      <p class="muted" style="margin:0 0 22px">This protects the dashboard where you build briefs and send candidate links. You can reset it any time.</p>
      <div class="card card-pad">
        <div class="field"><label>New password</label>${pwField('pw1','At least 6 characters')}</div>
        <div class="field"><label>Confirm password</label>${pwField('pw2','Re-enter password')}</div>
        <button class="btn btn-primary btn-block btn-lg" id="setupBtn">Create password &amp; continue</button>
        <p class="hint" style="margin-top:14px">Stored hashed in this browser only.</p>
      </div>
    </div></div></div>`;

async function enableCamMic(){clearCheckError();const btn=$('#enCam');btn.disabled=true;btn.textContent='Requesting…';

    const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}},audio:true});

    $('#camMsg').textContent='Camera and microphone are on.';btn.textContent='Re-enable';btn.disabled=false;
  }catch(err){btn.textContent='Enable';btn.disabled=false;handleMediaError(err,'camera and microphone');}

    const st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:10}},audio:false});

    st.getVideoTracks()[0].addEventListener('ended',()=>{Proctor.status.screen=false;if($('#scrMsg'))$('#scrMsg').textContent='Screen sharing stopped. Share again.';if($('#phScreen'))$('#phScreen').style.display='grid';refreshCheckUI();if(CAND_STEP==='work')updateProctorBar();});
    btn.textContent='Re-share';btn.disabled=false;
  }catch(err){btn.textContent='Share';btn.disabled=false;handleMediaError(err,'screen sharing');}
  refreshCheckUI();}

function handleMediaError(err,what){const n=err&&err.name?err.name:'';let m;
  if(n==='NotAllowedError'||n==='SecurityError')m=`Permission for ${what} was blocked. Click the camera/lock icon in your address bar, allow access, then try again.`;
  else if(n==='NotFoundError'||n==='DevicesNotFoundError')m=`No ${what} device found. Connect one and try again.`;
  else if(n==='NotReadableError')m=`Your ${what} is in use by another app. Close Zoom/Meet/etc. and try again.`;
  else if(err&&err.message==='unsupported')m=`${what.charAt(0).toUpperCase()+what.slice(1)} isn't supported here. Use Chrome or Edge on desktop.`;
  else if(n==='AbortError')m=`The ${what} request was cancelled. Press the button to try again.`;
  else m=`Couldn't start ${what}. Try again, or switch to Chrome/Edge on desktop.`;showCheckError(m);}

function startMicMeter(st){try{if(Proctor.audioCtx){Proctor.audioCtx.close();cancelAnimationFrame(Proctor.levelRAF);}const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();Proctor.audioCtx=ctx;const src=ctx.createMediaStreamSource(st);const an=ctx.createAnalyser();an.fftSize=256;src.connect(an);const data=new Uint8Array(an.frequencyBinCount);const w=$('#micMeterWrap');if(w)w.style.display='block';const loop=()=>{an.getByteFrequencyData(data);let s=0;for(let i=0;i<data.length;i++)s+=data[i];const lvl=Math.min(100,(s/data.length)*1.8);const m=$('#micMeter');if(m)m.style.width=lvl+'%';Proctor.levelRAF=requestAnimationFrame(loop);};loop();}catch(e){}}

function refreshCheckUI(){const ck=$('#ckCam'),cs=$('#ckScreen'),bb=$('#beginBtn');if(ck)ck.classList.toggle('done',Proctor.status.cam&&Proctor.status.mic);if(cs)cs.classList.toggle('done',Proctor.status.screen);if(bb)bb.disabled=!(Proctor.status.cam&&Proctor.status.mic&&Proctor.status.screen);}

function startCompositorRecording(){
  if(SKIP_CHECKS&&!(Proctor.status.cam||Proctor.status.screen)){Proctor.startTs=Date.now();return;}
  const canvas=$('#composer'),ctx=canvas.getContext('2d'),camV=$('#srcCam'),scrV=$('#srcScreen');
  if(Proctor.camStream)camV.srcObject=Proctor.camStream;if(Proctor.screenStream)scrV.srcObject=Proctor.screenStream;
  Proctor.composing=true;Proctor.startTs=Date.now();
  (function draw(){if(!Proctor.composing)return;try{
    ctx.fillStyle='#0c0c14';ctx.fillRect(0,0,canvas.width,canvas.height);
    if(Proctor.status.screen&&scrV.videoWidth){const r=Math.min(canvas.width/scrV.videoWidth,canvas.height/scrV.videoHeight),w=scrV.videoWidth*r,h=scrV.videoHeight*r;ctx.drawImage(scrV,(canvas.width-w)/2,(canvas.height-h)/2,w,h);}else{ctx.fillStyle='#5b5b76';ctx.font='600 26px Inter,sans-serif';ctx.fillText('Screen share paused',40,60);}
    if(camV.videoWidth){const pw=300,ph=225,px=canvas.width-pw-24,py=canvas.height-ph-24;ctx.drawImage(camV,px,py,pw,ph);ctx.strokeStyle='#6F71F8';ctx.lineWidth=4;ctx.strokeRect(px,py,pw,ph);}
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,canvas.width,40);ctx.fillStyle='#fff';ctx.font='500 20px Inter,sans-serif';ctx.textBaseline='middle';ctx.fillText('● REC  '+esc(CAND_CFG.name)+'   '+new Date().toLocaleString(),16,21);
  }catch(e){}requestAnimationFrame(draw);})();
  try{const cs=canvas.captureStream(12);const tr=[...cs.getVideoTracks()];if(Proctor.camStream&&Proctor.camStream.getAudioTracks().length)tr.push(Proctor.camStream.getAudioTracks()[0]);const mixed=new MediaStream(tr);let mime='video/webm;codecs=vp9,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp8,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';Proctor.recorder=new MediaRecorder(mixed,{mimeType:mime,videoBitsPerSecond:1200000});Proctor.chunks=[];Proctor.recorder.ondataavailable=e=>{if(e.data&&e.data.size)Proctor.chunks.push(e.data);};Proctor.recorder.start(2000);Proctor.status.recording=true;}catch(e){Proctor.status.recording=false;}
  Proctor.snaps=[];snapshot();Proctor.snapTimer=setInterval(snapshot,20000);
}
function snapshot(){try{const camV=$('#srcCam');if(!camV.videoWidth)return;const c=document.createElement('canvas');c.width=160;c.height=120;c.getContext('2d').drawImage(camV,0,0,160,120);Proctor.snaps.push(c.toDataURL('image/jpeg',0.5));if(Proctor.snaps.length>30)Proctor.snaps.shift();}catch(e){}}
function stopRecording(){return new Promise(res=>{Proctor.composing=false;clearInterval(Proctor.snapTimer);if(Proctor.recorder&&Proctor.recorder.state!=='inactive'){Proctor.recorder.onstop=()=>{try{Proctor.recordingUrl=URL.createObjectURL(new Blob(Proctor.chunks,{type:'video/webm'}));}catch(e){}res();};try{Proctor.recorder.stop();}catch(e){res();}}else res();});}

function beginAssessment(){startCompositorRecording();const pip=$('#pip'),pv=$('#pipVideo');if(Proctor.camStream){pv.srcObject=Proctor.camStream;pip.classList.remove('hidden');}CAND_STEP='work';CAND_TASK=0;startTimer();candWork();}

function startTimer(){if(!CAND_CFG.time)return;const end=Date.now()+CAND_CFG.time*60000;clearInterval(CAND_TIMERINT);CAND_TIMERINT=setInterval(()=>{const left=end-Date.now(),el=$('#timer');if(left<=0){clearInterval(CAND_TIMERINT);toast("Time's up — submitting.");finishAssessment();return;}if(el){const m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.style.color=left<300000?'var(--err)':'var(--ink)';}},500);}

function pdfPath(t){return t.pdf;} // relative file path, rendered by the browser's native PDF viewer

function candWork(){
  const tasks=CAND_CFG.tasks.map(id=>ASSETS.assessments.find(a=>a.id===id)).filter(Boolean);
  const t=tasks[CAND_TASK],file=pdfPath(t),url=file+'#toolbar=1&navpanes=0&view=FitH',ans=CAND_ANSWERS[t.id];
  app.innerHTML=topbar('Assessment in progress')+`<div class="wrap">
    <div class="proctorbar" id="proctorBar"></div>
    <div class="tabs" id="taskTabs">${tasks.map((tk,i)=>`<button class="tab ${i===CAND_TASK?'on':''}" data-i="${i}">${i+1}. ${esc(tk.title)} ${CAND_ANSWERS[tk.id].complete?'✓':''}</button>`).join('')}</div>
    <div class="ws"><div>
      <div class="pdf-head"><div><span class="eyebrow">Task ${CAND_TASK+1} of ${tasks.length}</span><h2 style="margin:4px 0 0;font-size:19px">${esc(t.title)}</h2><p class="muted" style="margin:2px 0 0;font-size:13px">${esc(t.subtitle)}</p></div><button class="btn btn-ghost btn-sm" id="openTab">Open full size ↗</button></div>
      <object class="pdf-frame" data="${url}" type="application/pdf" id="pdfObj"><iframe class="pdf-frame" src="${url}" title="${esc(t.title)} brief"></iframe></object>
      <p class="hint">View-only proof. If it doesn't appear above, <a href="${file}" target="_blank" rel="noopener">open it in a new tab</a>. Read the order details and the “After you vectorize the logo we need” section, then work in your own software.</p>
    </div><div class="work-card"><div class="card card-pad">
      <h3 style="margin:0 0 4px;font-size:16px">Your work for this task</h3>
      <p class="muted" style="font-size:13px;margin:0 0 14px">Describe your approach and list the file names you'll send back.</p>
      <div class="field"><label>Notes / approach</label><textarea class="textarea" id="notes" placeholder="Steps, decisions, colours used…">${esc(ans.notes)}</textarea></div>
      <div class="field"><label>Files you'll submit</label><input class="input" type="file" id="files" multiple><div class="hint" id="fileList">${ans.files.length?'Listed: '+ans.files.map(esc).join(', '):'No files added yet.'}</div></div>
      <label class="complete-box ${ans.complete?'on':''}" id="completeBox"><input type="checkbox" id="completeChk" ${ans.complete?'checked':''}><span><b style="font-size:14px">Mark task complete</b><br><span class="muted" style="font-size:12.5px">Tick when you've finished this task.</span></span></label>
      <div style="display:flex;gap:8px;margin-top:16px">${CAND_TASK>0?'<button class="btn btn-ghost btn-block" id="prevTask">← Previous</button>':''}${CAND_TASK<tasks.length-1?'<button class="btn btn-soft btn-block" id="nextTask">Next task →</button>':'<button class="btn btn-primary btn-block" id="finishBtn">Finish &amp; submit</button>'}</div>
    </div></div></div></div>`;
  updateProctorBar();
  $('#taskTabs').querySelectorAll('.tab').forEach(tb=>tb.onclick=()=>{saveCurrent();CAND_TASK=parseInt(tb.dataset.i);candWork();});
  $('#openTab').onclick=()=>window.open(file,'_blank');
  $('#notes').addEventListener('input',e=>CAND_ANSWERS[t.id].notes=e.target.value);
  $('#files').addEventListener('change',e=>{const n=Array.from(e.target.files).map(f=>f.name);CAND_ANSWERS[t.id].files=n;$('#fileList').textContent=n.length?'Listed: '+n.join(', '):'No files added yet.';});
  $('#completeChk').addEventListener('change',e=>{CAND_ANSWERS[t.id].complete=e.target.checked;$('#completeBox').classList.toggle('on',e.target.checked);$('#taskTabs').querySelectorAll('.tab')[CAND_TASK].innerHTML=`${CAND_TASK+1}. ${esc(t.title)} ${e.target.checked?'✓':''}`;});
  if($('#prevTask'))$('#prevTask').onclick=()=>{saveCurrent();CAND_TASK--;candWork();};
  if($('#nextTask'))$('#nextTask').onclick=()=>{saveCurrent();CAND_TASK++;candWork();};
  if($('#finishBtn'))$('#finishBtn').onclick=()=>{saveCurrent();confirmFinish();};
}
function saveCurrent(){const n=$('#notes');if(n){const t=CAND_CFG.tasks[CAND_TASK];if(CAND_ANSWERS[t])CAND_ANSWERS[t].notes=n.value;}}

function updateProctorBar(){const bar=$('#proctorBar');if(!bar)return;const s=Proctor.status;
  bar.innerHTML=`<span class="recwrap"><span class="dot live"></span>${s.recording?'REC':(PREVIEW_MODE&&SKIP_CHECKS?'PREVIEW':'LIVE')}</span>
    <span class="stat ${s.cam?'':'off'}"><span class="ic">${icCam()}</span>Camera ${s.cam?'on':'off'}</span>
    <span class="stat ${s.mic?'':'off'}"><span class="ic">${icMic()}</span>Mic ${s.mic?'on':'off'}</span>
    <span class="stat ${s.screen?'':'off'}"><span class="ic">${icScreen()}</span>Screen ${s.screen?'shared':'off'}</span>
    ${CAND_CFG.time?`<span class="timer" id="timer">${CAND_CFG.time}:00</span>`:'<span class="timer faint" style="margin-left:auto;font-size:12px;font-weight:500">No time limit</span>'}`;
  if(!s.screen&&!(PREVIEW_MODE&&SKIP_CHECKS)){bar.insertAdjacentHTML('beforeend',`<button class="btn btn-danger btn-sm" id="reshare" style="margin-left:8px">Re-share screen</button>`);$('#reshare').onclick=async()=>{await enableScreen();const v=$('#srcScreen');if(Proctor.screenStream)v.srcObject=Proctor.screenStream;updateProctorBar();};}}

function confirmFinish(){const inc=CAND_CFG.tasks.filter(id=>!CAND_ANSWERS[id].complete).length;if(inc){if(!confirm(`${inc} task(s) not marked complete. Submit anyway?`))return;}else{if(!confirm('Submit your assessment? Recording and answers will be finalised.'))return;}finishAssessment();}

async function finishAssessment(){
  app.innerHTML=topbar('Finishing')+`<div class="center-wrap" style="text-align:center;padding-top:90px"><div class="chev lg" style="justify-content:center;margin-bottom:18px"><i></i><i></i><i></i></div><h1 style="font-size:22px">Finalising your submission…</h1><p class="muted">Saving recording and answers.</p></div>`;
  clearInterval(CAND_TIMERINT);await stopRecording();const pip=$('#pip');if(pip)pip.classList.add('hidden');
  [Proctor.camStream,Proctor.screenStream].forEach(st=>{if(st)st.getTracks().forEach(t=>t.stop());});
  const submission={kind:'sm3-submission',sid:CAND_CFG.sid,name:CAND_CFG.name,email:CAND_CFG.email,submittedAt:Date.now(),duration:(Date.now()-(Proctor.startTs||Date.now()))/1000,proctor:{cam:Proctor.status.cam,mic:Proctor.status.mic,screen:Proctor.status.screen,snaps:Proctor.snaps.length},recording:!!Proctor.recordingUrl,snapshots:Proctor.snaps.slice(),answers:CAND_CFG.tasks.map(id=>({id,title:ASSETS.assessments.find(a=>a.id===id)?.title||id,notes:CAND_ANSWERS[id].notes,files:CAND_ANSWERS[id].files,complete:CAND_ANSWERS[id].complete}))};
  let delivered=false;if(CAND_CFG.hook){try{await fetch(CAND_CFG.hook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(submission)});delivered=true;}catch(e){}}
  CAND_STEP='done';candDone(submission,delivered);
}

function candDone(submission,delivered){
  app.innerHTML=topbar('Assessment complete')+`<div class="center-wrap" style="max-width:640px">${stepBar(3)}
    <div class="pill pill-ok" style="margin-bottom:10px"><span class="dot"></span>Completed</div>
    <h1 style="font-size:27px;margin:6px 0 6px">Thanks, ${esc((submission.name||'').split(' ')[0]||submission.name)} — you're done</h1>
    <p class="muted" style="margin:0 0 18px">${delivered?'Your submission was sent to the company automatically.':'Send the two files below to the company so they can review your work.'}</p>
    ${PREVIEW_MODE?`<div class="banner banner-info"><span>👁</span><div>This was a preview. Nothing was sent. <button class="btn-link" id="backAdmin">Back to dashboard</button></div></div>`:''}
    ${delivered?`<div class="banner banner-info"><span>✓</span><div>Answers delivered. You can still download the files below as a backup.</div></div>`:''}

    <div class="card card-pad" style="text-align:center;margin-bottom:16px;background:linear-gradient(135deg,#F7F7FF,#FBF5FF)">
      <p class="eyebrow" style="margin-bottom:4px">Your reference</p>
      <div style="font-family:'Space Grotesk';font-weight:700;font-size:40px;letter-spacing:.14em;color:var(--brand-deep)">${esc(submission.sid)}</div>
      <p class="muted" style="font-size:12.5px;margin:6px 0 0">Quote this code in your email so the company can match your submission.</p>
    </div>

    <div class="card card-pad" style="margin-bottom:16px">
      <h3 style="margin:0 0 10px;font-size:16px">Send these to the company</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-primary btn-block" id="dlSubmission">⬇ Download submission file (.sm3)</button>
        ${submission.recording?`<button class="btn btn-soft btn-block" id="dlVideo">⬇ Download proctoring recording (.webm)</button>`:'<p class="muted" style="font-size:13px;margin:0">No screen recording was captured in this browser — the submission file still contains your answers and camera snapshots.</p>'}
        ${submission.email?'<button class="btn btn-ghost btn-block" id="emailBack">✉ Open an email to the company</button>':''}
      </div>
      <p class="hint" style="margin-top:12px">The <b>.sm3</b> file holds your answers and proctoring snapshots — the company loads it straight into their dashboard. Attach both downloaded files to your email.</p>
    </div>
    <p class="hint" style="text-align:center">You can close this tab once you've sent your files.</p></div>`;
  if(PREVIEW_MODE&&$('#backAdmin'))$('#backAdmin').onclick=exitPreview;
  const fileBase=`submission_${(submission.name||'candidate').replace(/[^a-z0-9]+/ig,'_')}_${submission.sid}`;
  $('#dlSubmission').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(submission)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=fileBase+'.sm3';a.click();toast('Submission file downloaded.');};
  if(submission.recording&&$('#dlVideo'))$('#dlVideo').onclick=()=>{const a=document.createElement('a');a.href=Proctor.recordingUrl;a.download=fileBase+'.webm';a.click();};
  if($('#emailBack'))$('#emailBack').onclick=()=>{const s=encodeURIComponent(`Assessment submission — ${submission.name} (${submission.sid})`);const b=encodeURIComponent(`Hi,\n\nI've completed the assessment. My reference code is ${submission.sid}.\n\nI'm attaching my submission file (.sm3) and proctoring recording (.webm) to this email.\n\nThanks,\n${submission.name}`);location.href=`mailto:?subject=${s}&body=${b}`;};
}

function downloadReport(submission){
  const tasks=submission.answers.map(a=>{const t=ASSETS.assessments.find(x=>x.id===a.id);return `<div style="border:1px solid #e5e5f4;border-radius:12px;padding:16px;margin:12px 0"><h3 style="margin:0 0 6px">${esc(t?t.title:a.id)} — ${a.complete?'Completed':'Incomplete'}</h3><p style="color:#6e6e8a;font-size:13px">Files: ${a.files.length?a.files.map(esc).join(', '):'none listed'}</p><div style="background:#fafaff;border-radius:8px;padding:12px;white-space:pre-wrap">${esc(a.notes||'(no notes)')}</div></div>`;}).join('');
  const snaps=Proctor.snaps.map(s=>`<img src="${s}" style="width:160px;border-radius:8px;margin:4px">`).join('');
  const html=`<!doctype html><meta charset="utf-8"><title>Submission ${esc(submission.sid)}</title><body style="font-family:Inter,Arial,sans-serif;max-width:820px;margin:30px auto;padding:0 18px;color:#23233b"><h1 style="color:#4b4ddb">Assessment submission</h1><p><b>${esc(submission.name)}</b> ${submission.email?'· '+esc(submission.email):''}<br>Session ${esc(submission.sid)} · Submitted ${fmtDate(submission.submittedAt)}<br>Proctoring: camera ${submission.proctor.cam?'on':'off'}, mic ${submission.proctor.mic?'on':'off'}, screen ${submission.proctor.screen?'shared':'off'} · active ${Math.round(submission.duration/60)} min · ${submission.proctor.snaps} snapshots</p><h2>Task answers</h2>${tasks}<h2>Camera snapshots</h2><div style="display:flex;flex-wrap:wrap">${snaps||'<p>none</p>'}</div></body>`;
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download=`submission_${submission.name.replace(/\s+/g,'_')}_${submission.sid}.html`;a.click();
}

try{const _fi=document.createElement('link');_fi.rel='icon';_fi.href=ASSETS.logo;document.head.appendChild(_fi);}catch(e){}
render();
</script>
